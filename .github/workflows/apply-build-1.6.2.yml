name: ACCQUA Apply Build 1.6.2

on:
  push:
    branches:
      - build-1.6.2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'ACCQUA Sports — Build 1.6.2 applied') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: build-1.6.2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Build 1.6.2
        run: node scripts/apply-build-1.6.2.mjs
      - name: Validate
        run: npm run validate
      - name: Commit validated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "ACCQUA Sports — Build 1.6.2 applied"
          git push origin HEAD:build-1.6.2
