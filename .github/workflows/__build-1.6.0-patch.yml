name: Apply Build 1.6.0 guarded patch

on:
  push:
    branches:
      - build-1.6.0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: build-1.6.0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair temporary runner
        run: node scripts/__fix-build-1.6.0-runner.cjs

      - name: Syntax check patch
        run: node --check scripts/__apply-build-1.6.0.cjs

      - name: Apply Build 1.6.0
        run: node scripts/__apply-build-1.6.0.cjs

      - name: Install dependencies
        run: npm ci

      - name: Visual contracts
        run: npm run visual:contracts

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Remove temporary patch files
        run: git rm scripts/__apply-build-1.6.0.cjs scripts/__fix-build-1.6.0-runner.cjs .github/workflows/__build-1.6.0-patch.yml

      - name: Commit Build 1.6.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ACCQUA Sports — Build 1.6.0"
          git push origin HEAD:build-1.6.0
