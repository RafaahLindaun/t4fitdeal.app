name: ACCQUA CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: accqua-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, visual contracts, SQL and build
    runs-on: ubuntu-latest
    timeout-minutes: 18

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Materialize Build 1.5.0
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/build-1.5.0' && !contains(github.event.head_commit.message, 'feat: materialize Build 1.5.0 workout builder') }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-build-1.5.0.mjs
          npm version 1.5.0 --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scr/pages/AdminWorkoutBuilder.tsx scr/pages/admin-workout-builder-v150.css package.json package-lock.json
          git commit -m "feat: materialize Build 1.5.0 workout builder"
          git push

      - name: Test Build 1.4.6 classes SQL
        shell: bash
        run: |
          set -euo pipefail
          run_psql() {
            docker run --rm --network host \
              -e PGPASSWORD=postgres \
              -v "${GITHUB_WORKSPACE}:/workspace" \
              -w /workspace \
              postgres:16 \
              psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 "$@"
          }

          run_psql -f supabase/tests/build_1_4_6_classes_fixture.sql
          run_psql -f supabase/migrations/20260831023000_build_1_4_6_fix_classes_status_ambiguity.sql
          run_psql -f supabase/tests/build_1_4_6_classes_verify.sql

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Visual contracts
        run: npm run visual:contracts

      - name: TypeScript
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload TypeScript report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Production build
        run: npm run build
