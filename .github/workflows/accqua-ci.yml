name: ACCQUA CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

# Temporário durante a aplicação idempotente dos bloqueios de typecheck.
# Após o CI ficar verde, volta para contents: read e somente validação.
permissions:
  contents: write

concurrency:
  group: accqua-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply Build 1.4.5 typecheck fixes
        run: node scripts/apply-build-1.4.5-typecheck-fixes.mjs

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated hardening fixes when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clear Build 1.4.5 typecheck blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload TypeScript report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Production build
        run: npm run build
