name: ACCQUA CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

# TEMPORARIO: durante o hardening da Build 1.4.5 este workflow pode reparar
# o package-lock legado uma unica vez. Voltaremos para contents: read assim
# que o lockfile estiver sincronizado.
permissions:
  contents: write

concurrency:
  group: accqua-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Repair stale lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock for Build 1.4.5"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
