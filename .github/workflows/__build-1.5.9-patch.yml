name: Apply Build 1.5.9 source patch

on:
  push:
    branches:
      - build-1.5.9

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: build-1.5.9
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Build 1.5.9
        run: node scripts/__apply-build-1.5.9-v3.cjs

      - name: Remove temporary patch runner
        run: git rm scripts/__apply-build-1.5.9.cjs scripts/__apply-build-1.5.9-v2.cjs scripts/__apply-build-1.5.9-v3.cjs .github/workflows/__build-1.5.9-patch.yml

      - name: Commit Build 1.5.9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ACCQUA Sports — Build 1.5.9"
          git push origin HEAD:build-1.5.9
