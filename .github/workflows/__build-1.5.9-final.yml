name: Apply clean Build 1.5.9 functional patch

on:
  push:
    branches:
      - build-1.5.9

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-1.5.9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply clean Build 1.5.9
        run: node scripts/__apply-build-1.5.9-final.cjs
      - name: Remove temporary runner
        run: git rm scripts/__apply-build-1.5.9-final.cjs .github/workflows/__build-1.5.9-final.yml
      - name: Commit final Build 1.5.9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ACCQUA Sports — Build 1.5.9 functional fixes"
          git push origin HEAD:build-1.5.9
