<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <link rel="icon" type="image/png" href="/logo/accqua-ios-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/logo/accqua-ios-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>ACCQUA Sports</title>
  <meta name="theme-color" content="#04162f" />
  <meta name="description" content="ACCQUA Sports — treinos, aulas, evolução e acompanhamento em um só lugar." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ACCQUA Sports" />
  <meta name="application-name" content="ACCQUA Sports" />
  <style>
    html,
    body,
    #root {
      touch-action: manipulation;
    }

    #accqua-orientation-lock {
      display: none;
    }

    @media (max-width: 1023.98px) and (orientation: landscape) {
      #root {
        display: none !important;
      }

      #accqua-orientation-lock {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
        color: #f8fbff;
        background: #04162f;
        text-align: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #accqua-orientation-lock > div {
        max-width: 320px;
      }

      #accqua-orientation-lock strong {
        display: block;
        margin-bottom: 8px;
        color: #ffd128;
        font-size: 1.12rem;
      }

      #accqua-orientation-lock span {
        display: block;
        color: rgba(248, 251, 255, .78);
        font-size: .9rem;
        line-height: 1.45;
      }
    }
  </style>
  <script>
    (() => {
      const isMobileViewport = () => window.matchMedia("(max-width: 1023.98px)").matches;

      const lockPortrait = async () => {
        if (!isMobileViewport()) return;
        try {
          if (screen.orientation && typeof screen.orientation.lock === "function") {
            await screen.orientation.lock("portrait-primary");
          }
        } catch (_) {
          // iOS/Safari pode não permitir lock programático; o guard visual abaixo mantém o app somente em retrato.
        }
      };

      const preventGestureZoom = (event) => {
        if (isMobileViewport()) event.preventDefault();
      };

      document.addEventListener("gesturestart", preventGestureZoom, { passive: false });
      document.addEventListener("gesturechange", preventGestureZoom, { passive: false });
      document.addEventListener("gestureend", preventGestureZoom, { passive: false });
      document.addEventListener("touchmove", (event) => {
        if (isMobileViewport() && event.touches && event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener("touchend", (event) => {
        if (!isMobileViewport()) return;
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      window.addEventListener("load", () => void lockPortrait());
      window.addEventListener("orientationchange", () => void lockPortrait());
      window.addEventListener("pageshow", () => void lockPortrait());
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) void lockPortrait();
      });
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="accqua-orientation-lock" aria-live="assertive">
    <div>
      <strong>Use o app na vertical</strong>
      <span>A tela do ACCQUA Sports funciona somente em modo retrato.</span>
    </div>
  </div>
  <script type="module" src="/scr/main.tsx"></script>
</body>
</html>
